<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 초록</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#2E8C19;
}

header{
background:white;
padding:30px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
padding:30px;
}

.section{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:10px;
}

.board-tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.tab{
background:#f2f2f2;
padding:10px 15px;
border-radius:6px;
display:flex;
gap:8px;
align-items:center;
}

.tab button{
background:none;
border:none;
cursor:pointer;
}

.board-card{
border:1px solid #ddd;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

.progress{
height:8px;
background:#eee;
margin-top:8px;
}

.bar{
height:8px;
background:#2E8C19;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

button{
padding:6px 12px;
cursor:pointer;
background:#2E8C19;
color:white;
border:none;
border-radius:5px;
}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:25px;
width:350px;
border-radius:8px;
}

input,select{
width:100%;
margin-bottom:10px;
padding:6px;
}
</style>
</head>
<body>

<header>🌿 2026 초록 재관람 도장판</header>

<div class="container">

<div class="section">
<h3>📌 도장판</h3>
<div class="board-tabs" id="boardTabs"></div>
<button onclick="addBoard()">+ 도장판 추가</button>

<div id="boardCards"></div>
</div>

<div class="section">
<h3>🎟 할인권 지갑</h3>

40% 할인권 현재: <b id="couponCurrent">0</b> /
총 누적: <b id="couponTotal">0</b>
<br><br>
🎁 폴라로이드 누적: <b id="polaroidTotal">0</b>
<br><br>
<button onclick="openCouponModal()">+ 할인권 추가 / 차감</button>
</div>

<div class="section">
<h3>📅 회차 기록</h3>
<table>
<thead>
<tr id="visitHeader">
<th>날짜</th>
<th>할인 종류</th>
<th>배율</th>
<th>도장판</th>
<th>메모</th>
<th>관리</th>
</tr>
</thead>
<tbody id="visitBody"></tbody>
</table>

<br>
<button onclick="openVisitModal()">+ 회차 추가</button>
</div>

</div>

<!-- 회차 모달 -->
<div class="modal" id="visitModal">
<div class="modal-content">
<h3>회차 추가</h3>

<label>날짜</label>
<input type="date" id="vDate">

<label>할인 종류</label>
<select id="vDiscount">
<option>재관(30%)</option>
<option>40%할인</option>
<option>타임세</option>
<option>증빙 프리패스</option>
<option>교환</option>
<option>기타</option>
</select>

<label>도장 적립 배율</label>
<select id="vMulti">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<label>도장판 선택</label>
<select id="vBoard"></select>

<label>메모 (선택)</label>
<input type="text" id="vMemo">

<button onclick="saveVisit()">저장</button>
<button onclick="closeVisitModal()">취소</button>
</div>
</div>

<!-- 할인권 모달 -->
<div class="modal" id="couponModal">
<div class="modal-content">
<h3>할인권 추가 / 차감</h3>

<select id="cType">
<option value="add">추가</option>
<option value="sub">차감</option>
</select>

<input type="number" id="cAmount" placeholder="수량">
<input type="date" id="cDate">
<input type="text" id="cMemo" placeholder="메모 (선택)">

<button onclick="saveCoupon()">저장</button>
<button onclick="closeCouponModal()">취소</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("greenV5"))||{
boards:["도장판 1"],
visits:[],
coupon:{current:0,total:0,history:[]},
polaroid:0
};

function save(){
localStorage.setItem("greenV5",JSON.stringify(data));
render();
}

function addBoard(){
data.boards.push("도장판 "+(data.boards.length+1));
save();
}

function deleteBoard(i){
data.boards.splice(i,1);
save();
}

function render(){
boardTabs.innerHTML="";
boardCards.innerHTML="";
vBoard.innerHTML="";
visitBody.innerHTML="";

let stampCount=Array(data.boards.length).fill(0);

data.boards.forEach((b,i)=>{
boardTabs.innerHTML+=`
<div class="tab">${b}
<button onclick="deleteBoard(${i})">✕</button>
</div>`;

vBoard.innerHTML+=`<option value="${i}">${b}</option>`;

boardCards.innerHTML+=`
<div class="board-card">
<b>${b}</b><br>
현재: <span id="count${i}">0</span>/6
<div class="progress">
<div class="bar" id="bar${i}" style="width:0%"></div>
</div>
</div>`;
});

data.visits.forEach((v,index)=>{
stampCount[v.board]+=parseInt(v.multi);

visitBody.innerHTML+=`
<tr>
<td>${v.date}</td>
<td>${v.discount}</td>
<td>${v.multi}</td>
<td>${data.boards[v.board]}</td>
<td>${v.memo||""}</td>
<td><button onclick="deleteVisit(${index})">삭제</button></td>
</tr>`;
});

stampCount.forEach((c,i)=>{
document.getElementById("count"+i).innerText=c;
document.getElementById("bar"+i).style.width=(c/6*100)+"%";

if(c>=3){
data.coupon.current++;
data.coupon.total++;
}
if(c>=6){
data.polaroid++;
}
});

couponCurrent.innerText=data.coupon.current;
couponTotal.innerText=data.coupon.total;
polaroidTotal.innerText=data.polaroid;
}

function openVisitModal(){visitModal.style.display="flex";}
function closeVisitModal(){visitModal.style.display="none";}
function openCouponModal(){couponModal.style.display="flex";}
function closeCouponModal(){couponModal.style.display="none";}

function saveVisit(){
data.visits.push({
date:vDate.value,
discount:vDiscount.value,
multi:vMulti.value,
board:parseInt(vBoard.value),
memo:vMemo.value
});
save();
closeVisitModal();
}

function deleteVisit(i){
data.visits.splice(i,1);
save();
}

function saveCoupon(){
let amt=parseInt(cAmount.value);
if(cType.value==="add"){
data.coupon.current+=amt;
data.coupon.total+=amt;
}else{
data.coupon.current-=amt;
}
data.coupon.history.push({
type:cType.value,
amount:amt,
date:cDate.value,
memo:cMemo.value
});
save();
closeCouponModal();
}

render();
</script>

</body>
</html>
