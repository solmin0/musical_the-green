<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재관람 도장판</title>

<style>
body{
    font-family: sans-serif;
    background:#111;
    color:white;
    text-align:center;
    margin:0;
    padding:30px;
}

h1{margin-bottom:30px;}

button{
    padding:8px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.add-btn{background:crimson;color:white;}
.delete-btn{background:#444;color:white;}
.stamp-btn{background:gold;color:black;}

.board{
    border:1px solid #333;
    margin:20px auto;
    padding:20px;
    width:300px;
    border-radius:10px;
    background:#1e1e1e;
}

.stamps{
    font-size:24px;
    margin:15px 0;
}

.reward{
    margin-top:10px;
    font-weight:bold;
    color:gold;
}
select,input{
    padding:5px;
    margin:5px;
}
</style>
</head>

<body>

<h1>🎭 재관람 도장판</h1>

<div>
    <button class="add-btn" onclick="addBoard()">도장판 추가</button>
</div>

<hr>

<h2>예매 회차 추가</h2>

<select id="boardSelect"></select>
<input type="number" id="stampCount" min="1" value="1">
<button class="stamp-btn" onclick="addStamp()">도장 추가</button>

<div id="boards"></div>

<script>
let boards = [];
let boardId = 0;

function addBoard(){
    const id = boardId++;
    boards.push({id:id, stamps:0});
    render();
}

function deleteBoard(id){
    boards = boards.filter(b=>b.id!==id);
    render();
}

function addStamp(){
    const boardId = parseInt(document.getElementById("boardSelect").value);
    const count = parseInt(document.getElementById("stampCount").value);

    const board = boards.find(b=>b.id===boardId);
    if(board){
        board.stamps += count;
        render();
    }
}

function render(){
    const container = document.getElementById("boards");
    const select = document.getElementById("boardSelect");
    container.innerHTML="";
    select.innerHTML="";

    boards.forEach(board=>{
        const div = document.createElement("div");
        div.className="board";

        let rewardText="";
        if(board.stamps>=6){
            rewardText="🎁 6회차 달성! 폴라로이드 증정";
        }else if(board.stamps>=3){
            rewardText="🎫 3회차 달성! 40% 할인권 증정";
        }

        div.innerHTML=`
            <h3>도장판 #${board.id}</h3>
            <div class="stamps">${"⭐".repeat(board.stamps)}</div>
            <div>총 ${board.stamps}회 관람</div>
            <div class="reward">${rewardText}</div>
            <button class="delete-btn" onclick="deleteBoard(${board.id})">삭제</button>
        `;

        container.appendChild(div);

        const option=document.createElement("option");
        option.value=board.id;
        option.text="도장판 #"+board.id;
        select.appendChild(option);
    });
}
</script>

</body>
</html>
