<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 초록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#2E8C19}
.container{max-width:1100px;margin:auto;padding:30px 20px 80px}
h1{color:#fff;font-weight:500;margin-bottom:30px}
.card{background:rgba(255,255,255,0.95);border-radius:20px;padding:20px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,0.15)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:500}
button{background:#1f5f12;color:white;border:none;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:12px}
button:hover{opacity:.85}

/* 도장 */
.stamp-row{display:flex;gap:4px;margin:6px 0}
.stamp{width:6px;height:6px;border-radius:50%;border:1px solid #111}
.stamp.filled{background:#111}

/* 기록 */
.record{border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:10px;font-size:12px;display:flex;justify-content:space-between}
.small{font-size:11px;color:#555}
.manage-icons span{cursor:pointer;margin-left:10px;font-size:14px}

/* 혜택 */
.benefit-wrapper{display:flex;gap:15px;align-items:flex-start}
.benefit-box{border:1px solid #bbb;border-radius:16px;padding:15px;width:220px}
.benefit-title{text-align:center;font-weight:500;margin-bottom:10px}
.benefit-split{display:flex;border-top:1px solid #ccc;margin-top:10px}
.benefit-split div{flex:1;text-align:center;padding:8px 0;font-size:12px}
.benefit-split div:first-child{border-right:1px solid #ccc}

input,select{width:100%;padding:6px;margin-top:6px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;font-size:12px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);justify-content:center;align-items:center}
.modal-content{background:white;padding:25px;border-radius:18px;width:340px}

.inline-check{display:flex;align-items:center;gap:6px;font-size:12px}
</style>
</head>
<body>
<div class="container">
<h1>📘 2026 초록</h1>

<!-- 도장판 -->
<div class="card">
<div class="section-title">
<span>도장판</span>
<button onclick="addBoard()">추가</button>
</div>
<div id="boards"></div>
</div>

<!-- 혜택 -->
<div class="card">
<div class="section-title">
<span>혜택</span>
<button onclick="openBenefitModal()">조정</button>
</div>

<div class="benefit-wrapper">
<div class="benefit-box">
<div class="benefit-title">40% 할인권</div>
<div class="benefit-split">
<div>현재<br><strong id="benefitCurrent">0</strong></div>
<div>총 누적<br><strong id="benefitTotal">0</strong></div>
</div>
</div>
</div>

<div id="benefitHistory" class="small" style="margin-top:15px"></div>
</div>

<!-- 회차 기록 -->
<div class="card">
<div class="section-title">
<span>회차 기록</span>
<button onclick="openRecordModal()">회차 추가</button>
</div>
<div id="records"></div>
</div>
</div>

<!-- 회차 모달 -->
<div class="modal" id="recordModal">
<div class="modal-content">
<h3>회차 추가</h3>
<input type="date" id="recordDate">

<div class="inline-check">
<input type="checkbox" id="timeCheck">
<span>"공휴일 낮/밤 직접 선택"</span>
</div>

<select id="timeSelect" style="display:none">
<option value="">미선택</option>
<option value="낮">낮</option>
<option value="밤">밤</option>
</select>

<select id="discount">
<option>재관(30%)</option>
<option>40%할인</option>
<option>타임세</option>
<option>증빙 프리패스</option>
<option>교환</option>
<option>기타</option>
</select>

<select id="boardSelect"></select>
<button type="button" onclick="addBoard()" style="margin-top:-5px;margin-bottom:10px">+ 도장판 새로 만들기</button>

<input type="text" id="memo" placeholder="메모">

<button onclick="saveRecord()">저장</button>
<button onclick="closeRecordModal()">닫기</button>
</div>
</div>

<!-- 혜택 모달 -->
<div class="modal" id="benefitModal">
<div class="modal-content">
<h3>40% 할인권 조정</h3>
<select id="benefitType">
<option value="add">추가</option>
<option value="minus">차감</option>
</select>
<input type="number" id="benefitAmount" value="1">
<input type="date" id="benefitDate">
<input type="text" id="benefitMemo" placeholder="메모">
<button onclick="adjustBenefit()">확인</button>
<button onclick="closeBenefitModal()">닫기</button>
</div>
</div>

<script>
let boards=JSON.parse(localStorage.getItem('boards')||'[]');
let records=JSON.parse(localStorage.getItem('records')||'[]');
let benefit=JSON.parse(localStorage.getItem('benefit')||'{"current":0,"total":0,"history":[]}');

function saveAll(){
localStorage.setItem('boards',JSON.stringify(boards));
localStorage.setItem('records',JSON.stringify(records));
localStorage.setItem('benefit',JSON.stringify(benefit));
}

function render(){
const boardDiv=document.getElementById('boards');
boardDiv.innerHTML='';
boards.forEach(b=>{
let html=`<div class='record'>
<div>
<div>${b.name}</div>
<div class='stamp-row'>`;
for(let i=0;i<6;i++){
html+=`<div class='stamp ${i<b.stamps?'filled':''}'></div>`;
}
html+=`</div>
<div class='small'>현재 ${b.stamps}개</div>
</div>
<div class='manage-icons'>
<span onclick='renameBoard(${b.id})'>✎</span>
<span onclick='deleteBoard(${b.id})'>🗑</span>
</div>
</div>`;
boardDiv.innerHTML+=html;
});

// 혜택
benefitCurrent.innerText=benefit.current;
benefitTotal.innerText=benefit.total;

const histDiv=document.getElementById('benefitHistory');
histDiv.innerHTML='';
benefit.history.forEach(h=>{
histDiv.innerHTML+=`<div>${h.date} - ${h.type} ${h.amount} ${h.memo?'- '+h.memo:''}</div>`;
});

// 기록
const recDiv=document.getElementById('records');
recDiv.innerHTML='';
records.forEach(r=>{
recDiv.innerHTML+=`<div class='record'>
<div>
<div>${r.date} ${r.time||''}</div>
<div class='small'>${r.discount}</div>
<div class='small'>메모: ${r.memo||''}</div>
</div>
<div class='manage-icons'>
<span onclick='editRecord(${r.id})'>✎</span>
<span onclick='deleteRecord(${r.id})'>🗑</span>
</div>
</div>`;
});

const select=document.getElementById('boardSelect');
select.innerHTML='';
boards.forEach(b=>{
select.innerHTML+=`<option value='${b.id}'>${b.name}</option>`;
});

saveAll();
}

function addBoard(){
const name=prompt('도장판 이름 입력');
if(!name)return;
boards.push({id:Date.now(),name,stamps:0,reward:false});
render();
}

function renameBoard(id){
const name=prompt('새 이름 입력');
if(!name)return;
boards=boards.map(b=>b.id===id?{...b,name}:b);
render();
}

function deleteBoard(id){
boards=boards.filter(b=>b.id!==id);
render();
}

function openRecordModal(){recordModal.style.display='flex'}
function closeRecordModal(){recordModal.style.display='none'}
function openBenefitModal(){benefitModal.style.display='flex'}
function closeBenefitModal(){benefitModal.style.display='none'}

timeCheck.addEventListener('change',e=>{
timeSelect.style.display=e.target.checked?'block':'none';
});

function saveRecord(){
const date=recordDate.value;
const discount=discount.value;
const boardId=Number(boardSelect.value);
const memo=document.getElementById('memo').value;
const time=timeSelect.value;

const board=boards.find(b=>b.id===boardId);
if(board && board.stamps<6){
board.stamps++;
if(board.stamps===3 && !board.reward){
benefit.current++;
benefit.total++;
benefit.history.push({date,type:'획득',amount:1});
board.reward=true;
}
}

if(discount==='40%할인'){
benefit.current--;
benefit.history.push({date,type:'사용',amount:1});
}

records.push({id:Date.now(),date,discount,memo,time});
closeRecordModal();
render();
}

function editRecord(id){
alert('수정 기능은 다음 단계에서 추가 가능');
}

function deleteRecord(id){
records=records.filter(r=>r.id!==id);
render();
}

function adjustBenefit(){
const type=benefitType.value;
const amount=Number(benefitAmount.value);
const date=benefitDate.value;
const memo=benefitMemo.value;
if(type==='add'){benefit.current+=amount;benefit.total+=amount;benefit.history.push({date,type:'추가',amount,memo});}
else{benefit.current-=amount;benefit.history.push({date,type:'차감',amount,memo});}
closeBenefitModal();
render();
}

render();
</script>
</body>
</html>
