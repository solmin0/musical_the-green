<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 초록 도장판</title>

<style>
body{margin:0;font-family:sans-serif;background:#2E8C19;color:#333;}
header{background:white;padding:20px;text-align:center;font-size:22px;font-weight:bold;}
.container{padding:20px;}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.board{border:1px solid #ddd;border-radius:10px;padding:15px;margin-top:15px;}
.progress{height:8px;background:#eee;border-radius:5px;margin:5px 0;}
.progress-bar{height:8px;background:#2E8C19;border-radius:5px;}
button{padding:5px 10px;margin:3px;border:none;border-radius:6px;background:#2E8C19;color:white;cursor:pointer;}
input,select{padding:5px;margin:5px;border-radius:6px;border:1px solid #ccc;}
.visit{background:#f9f9f9;border-radius:6px;padding:8px;margin-top:5px;font-size:13px;}
.add-box{background:white;padding:15px;border-radius:12px;position:fixed;bottom:0;width:100%;left:0;box-shadow:0 -3px 10px rgba(0,0,0,0.2);}
</style>
</head>
<body>

<header>
🌿 2026 초록 재관람 도장판
<div style="font-size:12px;color:#2E8C19;">자동 저장됨</div>
</header>

<div class="container">

<div class="card">
<h3>🎟 할인권 지갑</h3>
40% 할인권 현재: <b id="current40">0</b> /
총 누적: <b id="total40">0</b><br>
🎁 폴라로이드 누적: <b id="polaroid">0</b>
</div>

<div class="card">
<h3>📌 도장판</h3>
<button onclick="addBoard()">도장판 추가</button>
<div id="boards"></div>
</div>

</div>

<div class="add-box">
<button onclick="toggleForm()">+ 회차 추가</button>
<div id="formArea" style="display:none;margin-top:10px;">
날짜 <input type="date" id="date">
할인
<select id="discount">
<option>재관(30%)</option>
<option>40%할인</option>
<option>타임세</option>
<option>증빙 프리패스</option>
<option>교환</option>
<option>기타</option>
</select>
배율
<select id="multiplier">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
도장판
<select id="boardSelect"></select>
새 도장판 이름 <input type="text" id="newBoard">
<button onclick="createBoard()">추가</button>
메모 <input type="text" id="memo">
<button onclick="saveVisit()">저장</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("greenFinal"))||{
boards:[],
visits:[],
current40:0,
total40:0,
polaroid:0
};

function save(){
localStorage.setItem("greenFinal",JSON.stringify(data));
render();
}

function addBoard(name="새 도장판"){
data.boards.push({name,stamps:0});
save();
}

function createBoard(){
if(!newBoard.value)return;
addBoard(newBoard.value);
newBoard.value="";
}

function toggleForm(){
formArea.style.display=formArea.style.display==="none"?"block":"none";
}

function recalc(){
data.boards.forEach(b=>b.stamps=0);
data.current40=0;
data.total40=0;
data.polaroid=0;

data.visits.forEach(v=>{
let b=data.boards[v.board];
if(!b)return;
let before=b.stamps;
let after=Math.min(6,before+parseInt(v.multiplier));
b.stamps=after;

if(before<3 && after>=3){
data.current40++;
data.total40++;
}
if(before<6 && after>=6){
data.polaroid++;
}
if(v.discount==="40%할인") data.current40--;
});
}

function saveVisit(){
let v={
date:date.value,
discount:discount.value,
multiplier:multiplier.value,
board:parseInt(boardSelect.value),
memo:memo.value
};
if(!v.date)return alert("날짜 입력");
data.visits.push(v);
recalc();
save();
}

function deleteVisit(i){
data.visits.splice(i,1);
recalc();
save();
}

function deleteBoard(i){
data.boards.splice(i,1);
recalc();
save();
}

function render(){
recalc();
current40.innerText=data.current40;
total40.innerText=data.total40;
polaroid.innerText=data.polaroid;

boards.innerHTML="";
boardSelect.innerHTML="";

data.boards.forEach((b,i)=>{
let boardDiv=document.createElement("div");
boardDiv.className="board";

let relatedVisits=data.visits.filter(v=>v.board===i);
let visitHTML="";
let cumulative=0;

relatedVisits.forEach((v,idx)=>{
cumulative+=parseInt(v.multiplier);
visitHTML+=`
<div class="visit">
${v.date} | ${v.discount} | +${v.multiplier}
| 누적 ${Math.min(cumulative,6)}
<button onclick="deleteVisit(${data.visits.indexOf(v)})">삭제</button>
</div>`;
});

boardDiv.innerHTML=`
<input value="${b.name}" onchange="renameBoard(${i},this.value)">
<button onclick="deleteBoard(${i})">삭제</button>
<div>${b.stamps}/6</div>
<div class="progress">
<div class="progress-bar" style="width:${(b.stamps/6)*100}%"></div>
</div>
<div>🎟 생성된 40%: ${b.stamps>=3?1:0} /
🎁 생성된 폴라: ${b.stamps>=6?1:0}</div>
${visitHTML}
`;

boards.appendChild(boardDiv);

boardSelect.innerHTML+=`<option value="${i}">${b.name}</option>`;
});
}

function renameBoard(i,name){
data.boards[i].name=name;
save();
}

render();
</script>

</body>
</html>
