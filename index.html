<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 초록</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Noto Sans KR',sans-serif;
background:#2E8C19;
}

header{
background:#f4f6f5;
padding:30px;
text-align:center;
font-size:24px;
font-weight:500;
}

.container{padding:30px;}

.section{
background:#f4f6f5;
padding:20px;
margin-bottom:25px;
border-radius:10px;
}

.board-card{
border:1px solid #d9d9d9;
padding:15px;
border-radius:8px;
margin-bottom:15px;
background:white;
}

.progress{
height:6px;
background:#ddd;
margin-top:8px;
}

.bar{
height:6px;
background:#2E8C19;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:14px;
}

button{
padding:6px 10px;
cursor:pointer;
background:#2E8C19;
color:white;
border:none;
border-radius:4px;
font-size:13px;
}

.small{
font-size:13px;
color:#666;
}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:25px;
width:360px;
border-radius:8px;
}

input,select{
width:100%;
margin-bottom:10px;
padding:6px;
font-family:'Noto Sans KR',sans-serif;
}
.hidden{display:none;}
.circle{font-size:10px;margin-right:5px;}
</style>
</head>
<body>

<header>🌿 2026 초록 재관람 도장판</header>

<div class="container">

<div class="section">
<h3><span class="circle">●</span>도장판</h3>
<div id="boardCards"></div>
<button onclick="addBoard()">도장판 추가</button>
</div>

<div class="section">
<h3><span class="circle">●</span>할인권 지갑</h3>
40% 할인권 현재: <b id="couponCurrent">0</b> /
총 누적: <b id="couponTotal">0</b><br><br>
폴라로이드 누적: <b id="polaroidTotal">0</b>
<br><br>
<button onclick="openCouponModal()">할인권 추가 / 차감</button>
</div>

<div class="section">
<h3><span class="circle">●</span>회차 기록</h3>
<table>
<thead>
<tr>
<th>날짜</th>
<th>낮/밤</th>
<th>할인</th>
<th>도장판</th>
<th>이번</th>
<th>현재 도장</th>
<th>관리</th>
</tr>
</thead>
<tbody id="visitBody"></tbody>
</table>
<br>
<button onclick="openVisitModal()">회차 추가</button>
</div>

</div>

<!-- 회차 모달 -->
<div class="modal" id="visitModal">
<div class="modal-content">
<h3>회차 추가</h3>

<label>날짜</label>
<input type="date" id="vDate">

<label>
<input type="checkbox" id="holidayCheck" onchange="toggleHoliday()"> 공휴일 낮/밤 직접 선택
</label>

<select id="vTime" class="hidden">
<option value="">미선택</option>
<option value="낮">낮</option>
<option value="밤">밤</option>
</select>

<label>할인 종류</label>
<select id="vDiscount">
<option>재관(30%)</option>
<option>40%할인</option>
<option>타임세</option>
<option>증빙 프리패스</option>
<option>교환</option>
<option>기타</option>
</select>

<label>도장 적립 배율</label>
<select id="vMulti">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<label>도장판 선택</label>
<select id="vBoard"></select>

<label>메모</label>
<input type="text" id="vMemo">

<button onclick="saveVisit()">저장</button>
<button onclick="closeVisitModal()">취소</button>
</div>
</div>

<!-- 할인권 모달 -->
<div class="modal" id="couponModal">
<div class="modal-content">
<h3>할인권 추가 / 차감</h3>

<select id="cType">
<option value="add">추가</option>
<option value="sub">차감</option>
</select>

<input type="number" id="cAmount" placeholder="수량">
<input type="date" id="cDate">
<input type="text" id="cMemo" placeholder="메모">

<button onclick="saveCoupon()">저장</button>
<button onclick="closeCouponModal()">취소</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("greenV7"))||{
boards:[{name:"도장판 1",stamps:0,got40:false,got6:false}],
visits:[],
coupon:{current:0,total:0},
polaroid:0
};

let editIndex=null;

function save(){
localStorage.setItem("greenV7",JSON.stringify(data));
render();
}

function addBoard(){
data.boards.push({name:"도장판 "+(data.boards.length+1),stamps:0,got40:false,got6:false});
save();
}

function deleteBoard(i){
data.boards.splice(i,1);
save();
}

function toggleHoliday(){
vTime.classList.toggle("hidden",!holidayCheck.checked);
}

function recalc(){
data.boards.forEach(b=>{b.stamps=0;b.got40=false;b.got6=false;});
data.coupon.current=0;
data.coupon.total=0;
data.polaroid=0;

data.visits.forEach(v=>{
let b=data.boards[v.board];
b.stamps+=parseInt(v.multi);

if(v.discount==="40%할인") data.coupon.current--;

if(b.stamps>=3 && !b.got40){
data.coupon.current++;
data.coupon.total++;
b.got40=true;
}
if(b.stamps>=6 && !b.got6){
data.polaroid++;
b.got6=true;
}
});
}

function render(){
recalc();
boardCards.innerHTML="";
visitBody.innerHTML="";
vBoard.innerHTML="";

data.boards.forEach((b,i)=>{
let next3=b.stamps<3?3-b.stamps:0;
let next6=b.stamps<6?6-b.stamps:0;

boardCards.innerHTML+=`
<div class="board-card">
<input value="${b.name}" onchange="renameBoard(${i},this.value)">
<button onclick="deleteBoard(${i})">삭제</button><br>
현재 도장: ${b.stamps}/6<br>
<span class="small">
${b.stamps<3?`3까지 ${next3} 남음`:
b.stamps<6?`6까지 ${next6} 남음`:
`모든 혜택 달성`}
</span>
<div class="progress">
<div class="bar" style="width:${(b.stamps/6)*100}%"></div>
</div>
</div>`;

vBoard.innerHTML+=`<option value="${i}">${b.name}</option>`;
});

let temp=Array(data.boards.length).fill(0);

data.visits.forEach((v,i)=>{
temp[v.board]+=parseInt(v.multi);
visitBody.innerHTML+=`
<tr>
<td>${v.date}</td>
<td>${v.time||""}</td>
<td>${v.discount}</td>
<td>${data.boards[v.board].name}</td>
<td>${v.multi}</td>
<td>${temp[v.board]}</td>
<td>
<button onclick="editVisit(${i})">수정</button>
<button onclick="deleteVisit(${i})">삭제</button>
</td>
</tr>`;
});

couponCurrent.innerText=data.coupon.current;
couponTotal.innerText=data.coupon.total;
polaroidTotal.innerText=data.polaroid;
}

function renameBoard(i,name){
data.boards[i].name=name;
save();
}

function openVisitModal(){
visitModal.style.display="flex";
}
function closeVisitModal(){
visitModal.style.display="none";
editIndex=null;
}

function saveVisit(){
let visit={
date:vDate.value,
time:vTime.value,
discount:vDiscount.value,
multi:vMulti.value,
board:parseInt(vBoard.value),
memo:vMemo.value
};

if(editIndex!==null){
data.visits[editIndex]=visit;
}else{
data.visits.push(visit);
}
save();
closeVisitModal();
}

function editVisit(i){
let v=data.visits[i];
editIndex=i;
vDate.value=v.date;
vTime.value=v.time||"";
vDiscount.value=v.discount;
vMulti.value=v.multi;
vBoard.value=v.board;
vMemo.value=v.memo;
visitModal.style.display="flex";
}

function deleteVisit(i){
data.visits.splice(i,1);
save();
}

function openCouponModal(){couponModal.style.display="flex";}
function closeCouponModal(){couponModal.style.display="none";}

function saveCoupon(){
let amt=parseInt(cAmount.value)||0;
if(cType.value==="add"){
data.coupon.current+=amt;
data.coupon.total+=amt;
}else{
data.coupon.current-=amt;
}
save();
closeCouponModal();
}

render();
</script>

</body>
</html>
