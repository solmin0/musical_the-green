<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 초록</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#2E8C19;
}

header{
background:#f5f7f6;
padding:30px;
text-align:center;
font-size:26px;
font-weight:bold;
letter-spacing:1px;
}

.container{padding:30px;}

.section{
background:#f5f7f6;
padding:20px;
margin-bottom:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.board-card{
border:1px solid #dcdcdc;
padding:15px;
border-radius:8px;
margin-bottom:15px;
background:white;
}

.progress{
height:6px;
background:#ddd;
margin-top:8px;
}

.bar{
height:6px;
background:#2E8C19;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

button{
padding:6px 12px;
cursor:pointer;
background:#2E8C19;
color:white;
border:none;
border-radius:4px;
}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:25px;
width:350px;
border-radius:8px;
}

input,select{
width:100%;
margin-bottom:10px;
padding:6px;
}
.small{
font-size:13px;
color:#666;
}
</style>
</head>
<body>

<header>🌿 2026 초록 재관람 도장판</header>

<div class="container">

<div class="section">
<h3>📌 도장판</h3>
<div id="boardCards"></div>
<button onclick="addBoard()">+ 도장판 추가</button>
</div>

<div class="section">
<h3>🎟 할인권 지갑</h3>
40% 할인권 현재: <b id="couponCurrent">0</b> /
총 누적: <b id="couponTotal">0</b><br><br>
🎁 폴라로이드 누적: <b id="polaroidTotal">0</b>
</div>

<div class="section">
<h3>📅 회차 기록</h3>
<table>
<thead>
<tr>
<th>날짜</th>
<th>할인 종류</th>
<th>도장판</th>
<th>이번 적립</th>
<th>현재 도장 수</th>
<th>관리</th>
</tr>
</thead>
<tbody id="visitBody"></tbody>
</table>
<br>
<button onclick="openVisitModal()">+ 회차 추가</button>
</div>

</div>

<!-- 회차 모달 -->
<div class="modal" id="visitModal">
<div class="modal-content">
<h3>회차 추가</h3>

<label>날짜</label>
<input type="date" id="vDate">

<label>할인 종류</label>
<select id="vDiscount">
<option>재관(30%)</option>
<option>40%할인</option>
<option>타임세</option>
<option>증빙 프리패스</option>
<option>교환</option>
<option>기타</option>
</select>

<label>도장 적립 배율</label>
<select id="vMulti">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<label>도장판 선택</label>
<select id="vBoard"></select>

<label>메모</label>
<input type="text" id="vMemo">

<button onclick="saveVisit()">저장</button>
<button onclick="closeVisitModal()">취소</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("greenV6"))||{
boards:[{name:"도장판 1",stamps:0,got40:false,got6:false}],
visits:[],
coupon:{current:0,total:0},
polaroid:0
};

function save(){
localStorage.setItem("greenV6",JSON.stringify(data));
render();
}

function addBoard(){
data.boards.push({name:"도장판 "+(data.boards.length+1),stamps:0,got40:false,got6:false});
save();
}

function recalc(){
data.boards.forEach(b=>{
b.stamps=0;
b.got40=false;
b.got6=false;
});
data.coupon.current=0;
data.coupon.total=0;
data.polaroid=0;

data.visits.forEach(v=>{
let b=data.boards[v.board];
b.stamps+=parseInt(v.multi);

if(v.discount==="40%할인"){
data.coupon.current--;
}

if(b.stamps>=3 && !b.got40){
data.coupon.current++;
data.coupon.total++;
b.got40=true;
}
if(b.stamps>=6 && !b.got6){
data.polaroid++;
b.got6=true;
}
});
}

function render(){
recalc();
boardCards.innerHTML="";
visitBody.innerHTML="";
vBoard.innerHTML="";

data.boards.forEach((b,i)=>{
let next3=b.stamps<3?3-b.stamps:0;
let next6=b.stamps<6?6-b.stamps:0;

boardCards.innerHTML+=`
<div class="board-card">
<b>${b.name}</b><br>
현재 도장: ${b.stamps}/6<br>
<span class="small">
${b.stamps<3?`3개까지 ${next3}개 남음`:
b.stamps<6?`6개까지 ${next6}개 남음`:
`모든 혜택 달성`}
</span>
<div class="progress">
<div class="bar" style="width:${(b.stamps/6)*100}%"></div>
</div>
</div>`;

vBoard.innerHTML+=`<option value="${i}">${b.name}</option>`;
});

let tempCounts=Array(data.boards.length).fill(0);

data.visits.forEach((v,i)=>{
tempCounts[v.board]+=parseInt(v.multi);

visitBody.innerHTML+=`
<tr>
<td>${v.date}</td>
<td>${v.discount}</td>
<td>${data.boards[v.board].name}</td>
<td>${v.multi}</td>
<td>${tempCounts[v.board]}</td>
<td><button onclick="deleteVisit(${i})">삭제</button></td>
</tr>`;
});

couponCurrent.innerText=data.coupon.current;
couponTotal.innerText=data.coupon.total;
polaroidTotal.innerText=data.polaroid;
}

function openVisitModal(){visitModal.style.display="flex";}
function closeVisitModal(){visitModal.style.display="none";}

function saveVisit(){
data.visits.push({
date:vDate.value,
discount:vDiscount.value,
multi:vMulti.value,
board:parseInt(vBoard.value),
memo:vMemo.value
});
save();
closeVisitModal();
}

function deleteVisit(i){
data.visits.splice(i,1);
save();
}

render();
</script>

</body>
</html>
